<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spin & Win Game</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: Arial, sans-serif;
        }
        
        .container {
            text-align: center;
            background: white;
            padding: 40px;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3);
        }
        
        h1 {
            color: #333;
            margin-bottom: 30px;
        }
        
        .wheel-container {
            position: relative;
            width: 300px;
            height: 300px;
            margin: 0 auto 30px;
        }
        
        .wheel {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background: conic-gradient(
                #FF6B6B 0deg 60deg,
                #4ECDC4 60deg 120deg,
                #FFE66D 120deg 180deg,
                #95E1D3 180deg 240deg,
                #F38181 240deg 300deg,
                #AA96DA 300deg 360deg
            );
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            color: white;
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
            transition: transform 0.1s;
        }
        
        .pointer {
            position: absolute;
            top: -15px;
            left: 50%;
            transform: translateX(-50%);
            width: 0;
            height: 0;
            border-left: 15px solid transparent;
            border-right: 15px solid transparent;
            border-top: 20px solid #333;
            z-index: 10;
        }
        
        button {
            padding: 15px 40px;
            font-size: 18px;
            font-weight: bold;
            border: none;
            border-radius: 10px;
            background: #667eea;
            color: white;
            cursor: pointer;
            transition: background 0.3s;
            margin: 10px 5px;
        }
        
        button:hover {
            background: #764ba2;
        }
        
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        
        .result {
            margin-top: 20px;
            font-size: 20px;
            font-weight: bold;
            color: #333;
            min-height: 30px;
        }
        
        .prize {
            color: #FF6B6B;
            font-size: 24px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎡 Spin & Win Game</h1>
        
        <div class="wheel-container">
            <div class="pointer"></div>
            <div class="wheel" id="wheel">
                <span>SPIN</span>
            </div>
        </div>
        
        <button id="spinBtn" onclick="spinWheel()">SPIN THE WHEEL</button>
        <button onclick="resetGame()">RESET</button>
        
        <div class="result">
            <div id="message"></div>
            <div class="prize" id="prize"></div>
        </div>
    </div>

    <script>
        const prizes = ['🎁 100 Points', '💰 500 Points', '🏆 Jackpot!', '⭐ 250 Points', '🎉 Free Spin', '💎 Premium'];
        let isSpinning = false;

        function spinWheel() {
            if (isSpinning) return;
            
            const wheel = document.getElementById('wheel');
            const spinBtn = document.getElementById('spinBtn');
            const messageDiv = document.getElementById('message');
            const prizeDiv = document.getElementById('prize');
            
            isSpinning = true;
            spinBtn.disabled = true;
            messageDiv.textContent = '';
            prizeDiv.textContent = '';
            
            const randomSpin = Math.floor(Math.random() * 3600) + 3600;
            const prizeIndex = Math.floor((randomSpin % 360) / 60);
            
            wheel.style.transition = 'transform 4s ease-out';
            wheel.style.transform = `rotate(${randomSpin}deg)`;
            
            setTimeout(() => {
                messageDiv.textContent = 'You Won!';
                prizeDiv.textContent = prizes[prizeIndex];
                isSpinning = false;
                spinBtn.disabled = false;
                wheel.style.transition = 'none';
            }, 4000);
        }
        
        function resetGame() {
            const wheel = document.getElementById('wheel');
            wheel.style.transform = 'rotate(0deg)';
            document.getElementById('message').textContent = '';
            document.getElementById('prize').textContent = '';
        }
    </script>
</body>
</html>
